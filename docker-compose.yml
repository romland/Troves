services:
  rembg:
    profiles: ["rembg", "full"]
    container_name: troves-rembg
    build: ./services/rembg
    image: ghcr.io/romland/troves-rembg:latest
    command: s --no-ui
    environment:
      - OMP_NUM_THREADS=2
      - MALLOC_ARENA_MAX=2
    mem_limit: 8g
    cpus: 2.0
    expose:
      - "7000"
    volumes:
      - ./services/rembg-data:/root/.rembg
    security_opt:
      - seccomp:unconfined
    restart: unless-stopped

  paddleocr:
    profiles: ["paddleocr", "full"]
    container_name: troves-paddleocr
    build: ./services/paddleocr
    image: ghcr.io/romland/troves-paddleocr:latest
    environment:
      - TZ=Europe/Amsterdam
      - PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK=True
      - FLAGS_use_mkldnn=0
      - PADDLE_PDX_ENABLE_MKLDNN_BYDEFAULT=0
      - OMP_WAIT_POLICY=PASSIVE
      - OMP_NUM_THREADS=2
    mem_limit: 1024m
    cpus: 2.0
    expose:
      - "8000"
    volumes:
      - ./services/paddleocr/downloads:/root/.paddleocr
      - ./services/paddleocr/paddlex_cache:/root/.paddlex
    security_opt:
      - seccomp:unconfined
    restart: unless-stopped

  singlefile:
    profiles: ["singlefile", "full"]
    container_name: troves-singlefile
    image: ghcr.io/romland/troves-singlefile:latest
    build: ./services/singlefile
    command: node webserver.js 8001
    mem_limit: 768m
    cpus: 1.5
    expose:
      - "8001"
    volumes:
      - ./services/singlefile:/opt/app
      - /opt/app/node_modules
    security_opt:
      - seccomp:unconfined
    restart: unless-stopped

  app:
    profiles: ["full"]
    container_name: troves-app
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/romland/troves-app:latest
    restart: unless-stopped
    mem_limit: 768m
    cpus: 2.0
    ports:
      - "${TROVES_PORT:-3000}:3000"
    environment:
      - PORT=3000
      - REMBG_URL=http://rembg:7000
      - PADDLE_URL=http://paddleocr:8000
      - SINGLEFILE_URL=http://singlefile:8001
      - BODY_SIZE_LIMIT=52428800
    env_file:
      - .env
    volumes:
      - ./prisma:/app/prisma
      - ./data:/app/data
      - ./build:/app/build
      - ./server.js:/app/server.js
      - ./cert.pem:/app/cert.pem:ro
      - ./key.pem:/app/key.pem:ro
    security_opt:
      - seccomp:unconfined
    depends_on:
      - rembg
      - paddleocr
      - singlefile
