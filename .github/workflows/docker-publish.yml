name: Build and Publish Containers

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  # push:
  #   branches: [ "main" ]
  #   tags: [ 'v*.*.*' ]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/troves

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 1. Build & Push App
      - name: Build and push App
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 2. Build & Push RemBG
      - name: Build and push RemBG
        uses: docker/build-push-action@v6
        with:
          context: ./services/rembg
          file: ./services/rembg/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-rembg:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 3. Build & Push SingleFile
      - name: Build and push SingleFile
        uses: docker/build-push-action@v6
        with:
          context: ./services/singlefile
          file: ./services/singlefile/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-singlefile:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 4. Build & Push PaddleOCR
      - name: Build and push PaddleOCR
        uses: docker/build-push-action@v6
        with:
          context: ./services/paddleocr
          file: ./services/paddleocr/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-paddleocr:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
