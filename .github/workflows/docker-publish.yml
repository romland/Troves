name: Build and Publish Containers

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      force_all:
        description: 'Force rebuild all images regardless of changes'
        type: boolean
        default: false
  # push:
  #   branches: [ "main" ]
  #   tags: [ 'v*.*.*' ]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/troves

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # --- NEW: Detect exactly which folders changed ---
      - name: Check for changed files
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            app:
              - 'Dockerfile'
              - 'Dockerfile.prod'
              - 'package*.json'
              - 'server.js'
              - 'src/**'
              - 'static/**'
              - 'scripts/**'
              - 'prisma/**'
            rembg:
              - 'services/rembg/**'
            singlefile:
              - 'services/singlefile/**'
            paddleocr:
              - 'services/paddleocr/**'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 1. Build & Push App (Only if app files changed, or forced)
      - name: Build and push App
        if: steps.filter.outputs.app == 'true' || inputs.force_all
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 2. Build & Push RemBG (Only if rembg files changed, or forced)
      - name: Build and push RemBG
        if: steps.filter.outputs.rembg == 'true' || inputs.force_all
        uses: docker/build-push-action@v6
        with:
          context: ./services/rembg
          file: ./services/rembg/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-rembg:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 3. Build & Push SingleFile (Only if singlefile files changed, or forced)
      - name: Build and push SingleFile
        if: steps.filter.outputs.singlefile == 'true' || inputs.force_all
        uses: docker/build-push-action@v6
        with:
          context: ./services/singlefile
          file: ./services/singlefile/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-singlefile:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 4. Build & Push PaddleOCR (Only if paddleocr files changed, or forced)
      - name: Build and push PaddleOCR
        if: steps.filter.outputs.paddleocr == 'true' || inputs.force_all
        uses: docker/build-push-action@v6
        with:
          context: ./services/paddleocr
          file: ./services/paddleocr/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-paddleocr:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max